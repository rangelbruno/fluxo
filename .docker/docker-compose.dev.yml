# Docker Compose para desenvolvimento
version: '3.8'

name: ferramenta

services:
  app:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
    container_name: ferramenta-app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ../:/var/www/html
      - ./php/php.ini:/usr/local/etc/php/php.ini
      - vendor:/var/www/html/vendor
    ports:
      - "8001:80"
      - "8444:443"
    environment:
      - APP_ENV=local
      - APP_DEBUG=true
      - DB_CONNECTION=null
      - CACHE_DRIVER=file
      - SESSION_DRIVER=file
      - QUEUE_CONNECTION=sync

volumes:
  vendor:
    driver: local